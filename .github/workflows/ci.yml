name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps without stale lock
        run: |
          rm -f package-lock.json
          npm install --no-fund --no-audit --legacy-peer-deps
      - name: Unit + integration
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://pirahanmardane.ir

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps without stale lock
        run: |
          rm -f package-lock.json
          npm install --no-fund --no-audit --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://pirahanmardane.ir
      - name: Build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://pirahanmardane.ir
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: "1"

  security-smoke:
    runs-on: ubuntu-latest
    needs: [unit-and-integration]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Make script executable
        run: chmod +x scripts/security-smoke.sh
      - name: Run security smoke
        env:
          BASE_URL: https://pirahanmardane.ir
        run: bash scripts/security-smoke.sh
        continue-on-error: true

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [unit-and-integration]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps without stale lock
        run: |
          rm -f package-lock.json
          npm install --no-fund --no-audit --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: E2E smoke against production
        run: npm run test:e2e:smoke
        env:
          PLAYWRIGHT_BASE_URL: https://pirahanmardane.ir
          CI: "true"
